[project]
name = "detector"
version = "0.1.0"
description = "Open research project: robust detection of AI-generated text"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jasper Meijerink", email = "jasper.meijerink@outlook.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.6",
    "transformers>=4.50",
    "datasets>=3.0",
    "scikit-learn>=1.6",
    "polars>=1.20",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
